name: OuttaScope CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & E2E Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Verify Python Syntax & Compilation
        run: |
          python -m compileall src/ tests/

      - name: Start FastAPI Background Server for Playwright
        run: |
          nohup python -m uvicorn src.app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/api/health; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server ($i)..."
            sleep 1
          done

      - name: Run Full Test Suite (Unit, Integration & Playwright E2E)
        run: |
          python -m pytest tests -v
