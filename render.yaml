services:
  - type: web
    name: outtascope
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn src.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_MODEL_NAME
        value: gemma2
      - key: TIGER_DATABASE_URL
        sync: false
